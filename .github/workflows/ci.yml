name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pos:pos@localhost:5432/pos
      # ทดสอบเส้นทางเดียวกับ production: สร้างตารางด้วย migration ไม่ใช่ synchronize
      DB_SYNC: 'false'
      JWT_SECRET: ci-only-secret-0123456789abcdef
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run seed  # รัน migration ก่อน seed
      - name: Entities match migrations
        run: npm run migration:check -w apps/api
      - name: API smoke + edge + Phase 3 (โหมดจำลองการชำระเงิน)
        env:
          TRUST_PROXY: '1'
          PAYMENT_PROVIDER: mock
        run: |
          node apps/api/dist/main.js &
          echo $! > api.pid
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break; sleep 1; done
          API_URL=http://localhost:3000/api node apps/api/scripts/smoke.mjs
          API_URL=http://localhost:3000/api node apps/api/scripts/edge.mjs
          API_URL=http://localhost:3000/api node apps/api/scripts/phase3.mjs
          kill $(cat api.pid)
      - name: Webhook รับแจ้งเงินเข้า (โหมด webhook + ตรวจลายเซ็น)
        env:
          TRUST_PROXY: '1'
          PAYMENT_PROVIDER: webhook
          PAYMENT_WEBHOOK_SECRET: ci-webhook-secret-0123456789abcdef
        run: |
          node apps/api/dist/main.js &
          echo $! > api.pid
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break; sleep 1; done
          API_URL=http://localhost:3000/api node apps/api/scripts/webhook.mjs
          kill $(cat api.pid)
